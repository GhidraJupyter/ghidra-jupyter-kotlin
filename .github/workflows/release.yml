name: Main

on:
  release:
    types: [published]

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - ghidra: "11.4.3"
          - ghidra: "11.4.2"
          - ghidra: "11.4.1"
          - ghidra: "11.4"
          - ghidra: "11.3.2"
          - ghidra: "11.3.1"
          - ghidra: "11.3"
          - ghidra: "11.2.1"
          - ghidra: "11.2"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.21
        uses: actions/setup-java@v1
        with:
          java-version: 1.21
      - uses: er28-0652/setup-ghidra@master
        with:
          version: ${{ matrix.ghidra }}
          auth_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Gradle
        working-directory: ./GhidraJupyterKotlin
        run: gradle buildExtension

      - name: Upload release ZIP
        working-directory: ./GhidraJupyterKotlin
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: gh release upload ${{github.event.release.tag_name}} dist/ghidra_${{matrix.ghidra}}_*.zip
