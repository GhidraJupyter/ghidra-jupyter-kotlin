// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

plugins {
	id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
	id 'idea'
}


compileKotlin {
	kotlinOptions.jvmTarget = "21"
}

kotlin {
	jvmToolchain(21)
}

configurations {
    requiredLibs //.extendsFrom implementation
}


	repositories {
			flatDir {
				dirs 'lib'
			}
			mavenCentral()
            // Add IntelliJ Deps repository for Jediterm
            maven { url 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies/' }
		}

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
}
else {
	throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

dependencies {
    // https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlin-jupyter-kernel
    api('org.jetbrains.kotlinx:kotlin-jupyter-kernel:0.16.0-742')

	// Needed for compiling
	// after building they are already included as part of the recursive dependencies of kotlin-jupyter-kernel
	api group: 'org.zeromq', name: 'jeromq', version: '0.6.0'

    // https://mvnrepository.com/artifact/org.jetbrains.jediterm/jediterm-ui
    implementation(group: 'org.jetbrains.jediterm', name: 'jediterm-ui', version: '3.57') {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
    }
    implementation(group: 'org.jetbrains.jediterm', name: 'jediterm-core', version: '3.57') {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
    }
//    implementation(group: 'org.jetbrains.jediterm', name: 'jediterm-pty', version: '2.69') {
//        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
//    }
    // pty4j-0.13.8.jar
    implementation 'org.jetbrains.pty4j:pty4j:0.13.8'
    testImplementation('junit:junit:4.13.1')
    testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.8.2")
}
compileKotlin.dependsOn(copyDependencies)
buildExtension.dependsOn(copyDependencies)

sourceSets {
	main {
		kotlin {
			srcDirs 'ghidra_scripts'
		}
	}
}
